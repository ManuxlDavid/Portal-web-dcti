<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Inventario</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-boxes"></i> Sistema de Inventario</h1>
        </header>
        <div class="app-container">
            <nav class="sidebar">
                <button class="nav-btn active" data-section="agregar">
                    <i class="fas fa-plus-circle"></i> Agregar Producto
                </button>
                <button class="nav-btn" data-section="retirar">
                    <i class="fas fa-minus-circle"></i> Retirar Producto
                </button>
                <button class="nav-btn" data-section="modificar">
                    <i class="fas fa-edit"></i> Modificar Producto
                </button>
                <button class="nav-btn" data-section="inventario">
                    <i class="fas fa-list"></i> Ver Inventario
                </button>
            </nav>
            <main class="content">
                <section id="agregar" class="section active">
                    <h2><i class="fas fa-plus"></i> Agregar Nuevo Producto</h2>
                    <form id="formAgregar">
                        <div class="form-group">
                            <label for="codigo">Código del Producto:</label>
                            <input type="text" id="codigo" required>
                        </div>
                        <div class="form-group">
                            <label for="nombre">Nombre del Producto:</label>
                            <input type="text" id="nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="categoria">Categoría:</label>
                            <select required id="categoria">
                                <option value="" disabled selected>Seleccionar categoría</option>
                                <option value="electronica">Repuesto</option>
                                <option value="ropa">Accesorio</option>
                                <option value="alimentos">Parte eléctrica</option>
                                <option value="hogar">Gomas</option>
                                <option value="otro">Otros</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cantidad">Cantidad:</label>
                            <input type="number" id="cantidad" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="precio">Precio por unidad:</label>
                            <input type="number" id="precio" step="0.01" min="0" required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar Producto
                        </button>
                    </form>
                </section>
                <section id="retirar" class="section">
                    <h2><i class="fas fa-minus"></i> Retirar Producto</h2>
                    <form id="formRetirar">
                        <div class="form-group">
                            <label for="codigoRetirar">Código del Producto:</label>
                            <input type="text" id="codigoRetirar" required>
                        </div>
                          <div class="form-group">
                            <label for="nombreRetirar">Nombre del Producto:</label>
                            <input type="text" id="nombreRetirar" required>
                        </div>
                        <div class="form-group">
                            <label for="cantidadRetirar">Cantidad a Retirar:</label>
                            <input type="number" id="cantidadRetirar" min="1" required>
                        </div>
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-download"></i> Retirar Producto
                        </button>
                    </form>
                
                </section>
                <section id="modificar" class="section">
                    <h2><i class="fas fa-edit"></i> Modificar Producto</h2>
                    <form id="formModificar">
                        <div class="form-group">
                            <label for="codigoModificar">Código del Producto:</label>
                            <input type="text" id="codigoModificar" required>
                        </div>
                        <div class="form-group">
                            <label for="nuevoNombre">Nuevo Nombre:</label>
                            <input type="text" id="nuevoNombre">
                        </div>
                        <div class="form-group">
                            <label for="nuevaCantidad">Nueva Cantidad:</label>
                            <input type="number" id="nuevaCantidad" min="0">
                        </div>
                        <div class="form-group">
                            <label for="nuevoPrecio">Nuevo Precio:</label>
                            <input type="number" id="nuevoPrecio" step="0.01" min="0">
                        </div>
                        <button type="submit" class="btn btn-info">
                            <i class="fas fa-sync-alt"></i> Actualizar Producto
                        </button>
                    </form>
                </section>
                <section id="inventario" class="section">
                    <h2><i class="fas fa-boxes"></i> Inventario Actual</h2>
                    <section id="inventario" class="section">
    <h2><i class="fas fa-boxes"></i> Inventario Actual</h2>
    <div class="instrucciones">
        <p><i class="fas fa-mouse-pointer"></i> <strong>Edición rápida:</strong> 
    </div>
    
    <div class="controls">
    </div>
</section>
                    <div class="controls">
                        <input type="text" id="buscarProducto" placeholder="Buscar producto...">
                        <button id="btnExportar" class="btn btn-secondary">
                            <i class="fas fa-file-export"></i> Exportar
                        </button>
                    </div>
                    <div class="table-container">
                        <table id="tablaInventario">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>Cantidad</th>
                                    <th>Precio</th>
                                    <th>Valor Total</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyInventario">
                            </tbody>
                        </table>
                    </div>
                    <div class="resumen">
                        <p>Total de Productos: <span id="totalProductos">0</span></p>
                        <p>Valor Total del Inventario: $<span id="valorTotal">0.00</span></p>
                    </div>
                </section>
            </main>
        </div>
        <div id="notificacion" class="notificacion"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
